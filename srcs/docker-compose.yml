services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    volumes:
      - wp-data:/var/www/html
    ports:
      - "443:443"
    depends_on: 
      - wordpress
    networks:
      - inception
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      CREDENTIALS_FILE: /run/secrets/credentials
    secrets:
      - credentials
    networks:
      - inception

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    volumes:
      - wp-data:/var/www/html
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb
      DOMAIN_NAME: ${DOMAIN_NAME}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_TABLE_PREFIX: wp_
      CREDENTIALS_FILE: /run/secrets/credentials
    secrets:
      - credentials
    depends_on:
      - mariadb
    networks:
      - inception

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cecompte/data/mariadb
  wp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cecompte/data/wordpress

networks:
  inception:
    driver: bridge

secrets:
  credentials:
    file: ../secrets/credentials.txt

